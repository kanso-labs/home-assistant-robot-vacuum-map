# Development tooling only. The integration itself is not a Python package:
# Home Assistant loads it from custom_components/ and installs what
# manifest.json lists, so nothing here is ever built or published, and this
# version never moves. The integration's version is manifest.json's, which
# release-please owns.
[project]
name = "home-assistant-robot-vacuum-map"
requires-python = ">=3.14.2"
version = "0.0.0"

# Split in two so the lint job installs ruff alone rather than Home Assistant.
# A plain `uv run` installs both groups, which is what a local run wants.
[dependency-groups]
lint = ["ruff==0.17.4"]
test = [
  # The Home Assistant release the tests run against, which the hassfest image
  # in lint.yaml also names. pytest-homeassistant is Home Assistant's own test
  # harness, published from its core repository under the same version, and it
  # pins homeassistant to that release itself. Both are named so the release
  # reads the same in each place Renovate moves it, and it moves the three
  # together.
  "homeassistant==2026.11.1",
  "pytest-homeassistant==2026.11.1",
  # Home Assistant's camera component requires this at this pin, and its test
  # harness installs no component's requirements, core ones included.
  "PyTurboJPEG==1.8.3",
  # vacuum-map-parser-ijai imports protobuf without declaring it. Home
  # Assistant's own images carry it, at the version its package constraints
  # pin, so the tests take that version too.
  "protobuf==7.36.0",
  # Measures the coverage the test workflow uploads. The harness above already
  # pulls it in, but the workflow depends on its flags, so it is pinned here
  # rather than left to whatever the harness happens to require.
  "pytest-cov==7.1.0",
  # manifest.json's requirements. Home Assistant's test harness never installs
  # an integration's requirements, so the tests can only import the integration
  # if they are already here. python-miio and vacuum-map-parser-roborock are at
  # the pins Home Assistant's own integrations give them, which the manifest
  # names only as minimums. Pillow is absent, as from the manifest, because
  # Home Assistant depends on it itself.
  "pybase64==1.5.2",
  "pycryptodome==4.4.0",
  "python-miio==0.5.12",
  "vacuum-map-parser-base==0.1.5",
  "vacuum-map-parser-dreame==0.1.3",
  "vacuum-map-parser-ijai==0.1.1",
  "vacuum-map-parser-roborock==0.1.5",
  "vacuum-map-parser-roidmi==0.1.3",
  "vacuum-map-parser-viomi==0.1.3",
  "vacuum-map-parser-xiaomi==0.1.4",
]

# pytest-homeassistant's own settings. Its hass fixture enables custom
# integrations by itself. respx's pytest plugin is turned off so that Home
# Assistant can install its httpx alias before respx is imported; the harness's
# HTTP mocks still use respx directly.
[tool.pytest.ini_options]
addopts = "-p no:respx"
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

# The workflow passes --cov and the report path, so a plain `uv run pytest`
# stays fast and prints no table. What is measured is set here, so both agree:
# `source` counts a module no test imports as zero rather than leaving it out of
# the total, and branch coverage is reported beside line coverage.
[tool.coverage.run]
branch = true
source = ["custom_components/robot_vacuum_map"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint.per-file-ignores]
# Upstream's connector catches whatever a cloud or device call raises and logs
# it, and keeps naive local timestamps that it only ever compares with each
# other. Both are deliberate there, so the rules against them are waived for the
# connector rather than its error handling being rewritten to satisfy them.
"custom_components/robot_vacuum_map/connector/**" = ["BLE001", "DTZ005", "S110"]

[tool.uv]
default-groups = ["lint", "test"]
package = false
