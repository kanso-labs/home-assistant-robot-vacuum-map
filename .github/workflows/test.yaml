name: Test

on:
  # Every pull request, for the stacked pull requests described in lint.yaml.
  pull_request:
  push:
    branches:
      - main

permissions:
  code-quality: write
  contents: read

# See lint.yaml: a newer push supersedes an older run, except on main.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: test-${{ github.ref }}

jobs:
  test:
    name: Run pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Installs the Python and uv that .tool-versions pins, so this job and
      # a local run resolve the same versions.
      - name: Set up mise
        uses: jdx/mise-action@v5.2.8

      - name: Run tests
        run: >-
          uv run --locked --no-default-groups --group test pytest
          --cov=custom_components/robot_vacuum_map --cov-report=term
          --cov-report=xml:coverage/cobertura-coverage.xml

      # fail-on-error is false because the action's default, true, makes this
      # step wait up to 160 seconds for a service GitHub ships as public preview
      # and fail if the upload errored or never finished processing. `Test`
      # is a required check, so that default would put every
      # merge behind an upload, with the tests already green. The failure is
      # still reported, as an annotation. A missing report or an invalid input
      # still fails the step.
      #
      # Once, here, rather than per leg: the job has no matrix.
      - name: Upload coverage report
        uses: actions/upload-code-coverage@v1.4.4
        with:
          fail-on-error: false
          file: coverage/cobertura-coverage.xml
          label: code-coverage/pytest
          language: Python

  # The fixed name the ruleset requires, as in lint.yaml.
  confirm:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - test
    if: always()
    steps:
      - name: Check the tests succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<< "${NEEDS}")
          if [[ -n "${failed}" ]]; then
            echo "Tests did not succeed:"
            echo "${failed}"
            exit 1
          fi
